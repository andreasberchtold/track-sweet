<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Only this site and Google (sign-in and Drive) are allowed. If the app
         calls another service, add its address to connect-src (and img-src). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/ https://www.googleapis.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>__APP_NAME__</title>
    <meta name="theme-color" content="#f4f3f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15121c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="stylesheet" href="../../core/core.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
