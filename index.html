<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>My apps</title>
    <link rel="icon" type="image/png" href="core/favicon.png" />
    <link rel="stylesheet" href="core/core.css" />
    <link rel="stylesheet" href="core/launcher.css" />
  </head>
  <body>
    <div id="app">
      <header class="pa-bar"><h1 class="pa-bar__title">My apps</h1></header>
      <main class="pa-main"><ul class="la-list" id="apps"></ul></main>
      <footer class="la-footer"><p class="pa-muted" id="version"></p></footer>
    </div>
    <script type="module" src="core/launcher.js"></script>
  </body>
</html>
